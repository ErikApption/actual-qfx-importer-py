[tool.poetry]
name = "actual-qfx-importer-py"
version = "0.1.0"
description = "Python web application for importing QFX/OFX bank transactions into Actual Budget"
authors = []
readme = "README.md"
packages = [{include = "qfx_importer"}]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
reflex = "0.9.1"
actualpy = "0.22.1"
ofxparse = "0.21"
sqlmodel = "0.0.38"
passlib = {version = ">=1.7.4", extras = ["bcrypt"]}

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"
pytest-asyncio = ">=0.23"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]

